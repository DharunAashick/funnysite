# Netlify build configuration
[build]
  command = "npm run build"
  publish = "dist"

# Redirect all routes to index.html for SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for CORS (if needed)
[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
